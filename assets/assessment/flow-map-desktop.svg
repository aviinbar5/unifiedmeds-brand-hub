<svg xmlns="http://www.w3.org/2000/svg" width="928" height="920" class="fm fm--desk" viewBox="0 0 928 920" role="img" aria-labelledby="fm-d-t fm-d-d"><title id="fm-d-t">Assessment flow map, desktop</title><desc id="fm-d-d">Welcome and email, then seven steps from About you to Plan and send (recommendation, checkout, ID), then Send to your provider. Exits on the right: Emergency, Not available in your state, See a provider in person, Not eligible online. Save and finish later works from any step. After Send: provider review, pharmacy, delivery.</desc><style>
.fm text { font-family: Inter, Arial, sans-serif; }
.fm-h { font-size: 12px; font-weight: 600; fill: #55747F; }
.fm-t { font-size: 14px; font-weight: 600; fill: #1C3742; }
.fm-m { font-size: 12px; fill: #55747F; }
.fm-n rect { fill: #FFFFFF; stroke: #55747F; stroke-width: 1; }
.fm-n--pre rect { fill: #E8E7E1; stroke: #E8E7E1; }
.fm-n--send rect { fill: #1C3742; stroke: #1C3742; }
.fm-n--send .fm-t { fill: #FEFCF6; }
.fm-n--send .fm-m { fill: #A8BEC7; }
.fm-n--after rect { fill: #FEFCF6; stroke: #B0A895; stroke-dasharray: 4 4; }
.fm-num { fill: #FEFCF6; stroke: #264653; stroke-width: 1; }
.fm-numt { font-size: 13px; font-weight: 600; fill: #264653; }
.fm-x rect { fill: #FEFCF6; stroke: #55747F; stroke-width: 1; }
.fm-x--sos > rect { stroke: #1C3742; stroke-width: 2; }
.fm-xdot { fill: #E76F51; }
.fm-x .fm-xbar { fill: #FEFCF6; stroke: none; }
.fm-save rect { fill: #A8BEC7; }
.fm-l { fill: none; stroke: #55747F; stroke-width: 1.5; }
.fm-l--x { stroke-dasharray: 4 3; }
.fm-l--after { stroke: #B0A895; stroke-dasharray: 4 4; }
.fm-l--save { stroke: #6E8B97; }
.fm-arrow { fill: #55747F; }
</style><defs><marker id="fm-a-d" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="fm-arrow" d="M0 0L8 4L0 8Z"/></marker></defs><text class="fm-h" x="0" y="20">Any step</text><text class="fm-h" x="216" y="20">The assessment, in order</text><text class="fm-h" x="616" y="20">Exits (suggested, the clinical team decides)</text><path class="fm-l" d="M384 104V122" marker-end="url(#fm-a-d)"/><path class="fm-l" d="M384 172V190" marker-end="url(#fm-a-d)"/><path class="fm-l" d="M384 240V258" marker-end="url(#fm-a-d)"/><path class="fm-l" d="M384 308V326" marker-end="url(#fm-a-d)"/><path class="fm-l" d="M384 376V394" marker-end="url(#fm-a-d)"/><path class="fm-l" d="M384 444V462" marker-end="url(#fm-a-d)"/><path class="fm-l" d="M384 512V530" marker-end="url(#fm-a-d)"/><path class="fm-l" d="M384 580V598" marker-end="url(#fm-a-d)"/><path class="fm-l fm-l--after" d="M384 648V706" marker-end="url(#fm-a-d)"/><path class="fm-l fm-l--after" d="M384 756V774" marker-end="url(#fm-a-d)"/><path class="fm-l fm-l--after" d="M384 824V842" marker-end="url(#fm-a-d)"/><text class="fm-h" x="216" y="694">After Send (Product screens)</text><path class="fm-l fm-l--x" d="M552 74H562V80H614" marker-end="url(#fm-a-d)"/><path class="fm-l fm-l--x" d="M552 210H562V80H614" marker-end="url(#fm-a-d)"/><path class="fm-l fm-l--x" d="M552 346H562V80H614" marker-end="url(#fm-a-d)"/><path class="fm-l fm-l--x" d="M552 148H576V186H614" marker-end="url(#fm-a-d)"/><path class="fm-l fm-l--x" d="M552 556H576V186H614" marker-end="url(#fm-a-d)"/><path class="fm-l fm-l--x" d="M552 222H590V292H614" marker-end="url(#fm-a-d)"/><path class="fm-l fm-l--x" d="M552 154H604V398H614" marker-end="url(#fm-a-d)"/><path class="fm-l fm-l--x" d="M552 290H604V398H614" marker-end="url(#fm-a-d)"/><g class="fm-x fm-x--sos"><rect x="616" y="52" width="312" height="56" rx="12"/><circle class="fm-xdot" cx="636" cy="80" r="8"/><rect class="fm-xbar" x="635" y="75.5" width="2" height="5.5" rx="1"/><circle class="fm-xbar" cx="636" cy="83.5" r="1.1"/><text class="fm-t" x="654" y="77">Emergency: call 911</text><text class="fm-m" x="654" y="94">Urgent signs, from any screen</text></g><g class="fm-x"><rect x="616" y="158" width="312" height="56" rx="12"/><circle class="fm-xdot" cx="636" cy="186" r="8"/><rect class="fm-xbar" x="635" y="181.5" width="2" height="5.5" rx="1"/><circle class="fm-xbar" cx="636" cy="189.5" r="1.1"/><text class="fm-t" x="654" y="183">Not available in your state</text><text class="fm-m" x="654" y="200">Inline on the state screen (E-05), then Notify me</text></g><g class="fm-x"><rect x="616" y="264" width="312" height="56" rx="12"/><circle class="fm-xdot" cx="636" cy="292" r="8"/><rect class="fm-xbar" x="635" y="287.5" width="2" height="5.5" rx="1"/><circle class="fm-xbar" cx="636" cy="295.5" r="1.1"/><text class="fm-t" x="654" y="289">See a provider in person</text><text class="fm-m" x="654" y="306">Heart and blood pressure answers</text></g><g class="fm-x"><rect x="616" y="370" width="312" height="56" rx="12"/><circle class="fm-xdot" cx="636" cy="398" r="8"/><rect class="fm-xbar" x="635" y="393.5" width="2" height="5.5" rx="1"/><circle class="fm-xbar" cx="636" cy="401.5" r="1.1"/><text class="fm-t" x="654" y="395">Not eligible online</text><text class="fm-m" x="654" y="412">Age, sex at birth, nitrates</text></g><g class="fm-n fm-n--pre"><rect x="216" y="56" width="336" height="48" rx="12"/><text class="fm-t" x="232" y="85">Welcome and email</text><text class="fm-m" x="536" y="84" text-anchor="end">2 screens · not counted</text></g><g class="fm-n"><rect x="216" y="124" width="336" height="48" rx="12"/><circle class="fm-num" cx="244" cy="148" r="14"/><text class="fm-numt" x="244" y="153" text-anchor="middle">1</text><text class="fm-t" x="268" y="153">About you</text><text class="fm-m" x="536" y="152" text-anchor="end">4 screens</text></g><g class="fm-n"><rect x="216" y="192" width="336" height="48" rx="12"/><circle class="fm-num" cx="244" cy="216" r="14"/><text class="fm-numt" x="244" y="221" text-anchor="middle">2</text><text class="fm-t" x="268" y="221">Health history</text><text class="fm-m" x="536" y="220" text-anchor="end">7 screens</text></g><g class="fm-n"><rect x="216" y="260" width="336" height="48" rx="12"/><circle class="fm-num" cx="244" cy="284" r="14"/><text class="fm-numt" x="244" y="289" text-anchor="middle">3</text><text class="fm-t" x="268" y="289">Medications</text><text class="fm-m" x="536" y="288" text-anchor="end">5 screens</text></g><g class="fm-n"><rect x="216" y="328" width="336" height="48" rx="12"/><circle class="fm-num" cx="244" cy="352" r="14"/><text class="fm-numt" x="244" y="357" text-anchor="middle">4</text><text class="fm-t" x="268" y="357">Your main concern</text><text class="fm-m" x="536" y="356" text-anchor="end">7 screens</text></g><g class="fm-n"><rect x="216" y="396" width="336" height="48" rx="12"/><circle class="fm-num" cx="244" cy="420" r="14"/><text class="fm-numt" x="244" y="425" text-anchor="middle">5</text><text class="fm-t" x="268" y="425">Preferences</text><text class="fm-m" x="536" y="424" text-anchor="end">4 screens</text></g><g class="fm-n"><rect x="216" y="464" width="336" height="48" rx="12"/><circle class="fm-num" cx="244" cy="488" r="14"/><text class="fm-numt" x="244" y="493" text-anchor="middle">6</text><text class="fm-t" x="268" y="493">Consent and account</text><text class="fm-m" x="536" y="492" text-anchor="end">2 screens</text></g><g class="fm-n"><rect x="216" y="532" width="336" height="48" rx="12"/><circle class="fm-num" cx="244" cy="556" r="14"/><text class="fm-numt" x="244" y="561" text-anchor="middle">7</text><text class="fm-t" x="268" y="561">Plan and send</text><text class="fm-m" x="536" y="560" text-anchor="end">plan, checkout, ID, send</text></g><g class="fm-n fm-n--send"><rect x="216" y="600" width="336" height="48" rx="12"/><text class="fm-t" x="232" y="629">Send to your provider</text><text class="fm-m" x="536" y="628" text-anchor="end">the one Yellow button</text></g><g class="fm-n fm-n--after"><rect x="216" y="708" width="336" height="48" rx="12"/><text class="fm-t" x="232" y="737">Provider review</text><text class="fm-m" x="536" y="736" text-anchor="end">[time · operations, R-68]</text></g><g class="fm-n fm-n--after"><rect x="216" y="776" width="336" height="48" rx="12"/><text class="fm-t" x="232" y="805">Pharmacy</text><text class="fm-m" x="536" y="804" text-anchor="end">[partner · operations]</text></g><g class="fm-n fm-n--after"><rect x="216" y="844" width="336" height="48" rx="12"/><text class="fm-t" x="232" y="873">Delivery</text><text class="fm-m" x="536" y="872" text-anchor="end">packed with care · [time]</text></g><path class="fm-l fm-l--save" d="M212 124H196V580H212"/><g class="fm-save"><rect x="0" y="278" width="176" height="148" rx="12"/><text class="fm-t" x="16" y="308">Save and finish later</text><text class="fm-m" x="16" y="330">From any step. Answers</text><text class="fm-m" x="16" y="348">are saved on Continue.</text><text class="fm-m" x="16" y="374">A link by email brings</text><text class="fm-m" x="16" y="392">him back to the next</text><text class="fm-m" x="16" y="410">open question.</text></g><path class="fm-l fm-l--save" d="M176 352H194" marker-end="url(#fm-a-d)"/></svg>
