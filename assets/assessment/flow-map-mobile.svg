<svg xmlns="http://www.w3.org/2000/svg" width="350" height="1460" class="fm fm--mob" viewBox="0 0 350 1460" role="img" aria-labelledby="fm-m-t"><title id="fm-m-t">Assessment flow map, mobile: the steps in order with their exits under each step</title><style>
.fm text { font-family: Inter, Arial, sans-serif; }
.fm-h { font-size: 12px; font-weight: 600; fill: #55747F; }
.fm-t { font-size: 14px; font-weight: 600; fill: #1C3742; }
.fm-m { font-size: 12px; fill: #55747F; }
.fm-n rect { fill: #FFFFFF; stroke: #55747F; stroke-width: 1; }
.fm-n--pre rect { fill: #E8E7E1; stroke: #E8E7E1; }
.fm-n--send rect { fill: #1C3742; stroke: #1C3742; }
.fm-n--send .fm-t { fill: #FEFCF6; }
.fm-n--send .fm-m { fill: #A8BEC7; }
.fm-n--after rect { fill: #FEFCF6; stroke: #B0A895; stroke-dasharray: 4 4; }
.fm-num { fill: #FEFCF6; stroke: #264653; stroke-width: 1; }
.fm-numt { font-size: 13px; font-weight: 600; fill: #264653; }
.fm-x rect { fill: #FEFCF6; stroke: #55747F; stroke-width: 1; }
.fm-x--sos > rect { stroke: #1C3742; stroke-width: 2; }
.fm-xdot { fill: #E76F51; }
.fm-x .fm-xbar { fill: #FEFCF6; stroke: none; }
.fm-save rect { fill: #A8BEC7; }
.fm-l { fill: none; stroke: #55747F; stroke-width: 1.5; }
.fm-l--x { stroke-dasharray: 4 3; }
.fm-l--after { stroke: #B0A895; stroke-dasharray: 4 4; }
.fm-l--save { stroke: #6E8B97; }
.fm-arrow { fill: #55747F; }
</style><defs><marker id="fm-a-m" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="fm-arrow" d="M0 0L8 4L0 8Z"/></marker></defs><path class="fm-l fm-l--x" d="M24 144V179H38" marker-end="url(#fm-a-m)"/><path class="fm-l" d="M24 204V218" marker-end="url(#fm-a-m)"/><path class="fm-l fm-l--x" d="M24 276V311H38" marker-end="url(#fm-a-m)"/><path class="fm-l fm-l--x" d="M24 276V371H38" marker-end="url(#fm-a-m)"/><path class="fm-l" d="M24 396V410" marker-end="url(#fm-a-m)"/><path class="fm-l fm-l--x" d="M24 468V503H38" marker-end="url(#fm-a-m)"/><path class="fm-l fm-l--x" d="M24 468V563H38" marker-end="url(#fm-a-m)"/><path class="fm-l" d="M24 588V602" marker-end="url(#fm-a-m)"/><path class="fm-l fm-l--x" d="M24 660V695H38" marker-end="url(#fm-a-m)"/><path class="fm-l" d="M24 720V734" marker-end="url(#fm-a-m)"/><path class="fm-l fm-l--x" d="M24 792V827H38" marker-end="url(#fm-a-m)"/><path class="fm-l" d="M24 852V866" marker-end="url(#fm-a-m)"/><path class="fm-l" d="M24 924V938" marker-end="url(#fm-a-m)"/><path class="fm-l" d="M24 996V1010" marker-end="url(#fm-a-m)"/><path class="fm-l fm-l--x" d="M24 1068V1103H38" marker-end="url(#fm-a-m)"/><path class="fm-l" d="M24 1128V1142" marker-end="url(#fm-a-m)"/><path class="fm-l fm-l--after" d="M24 1200V1242" marker-end="url(#fm-a-m)"/><path class="fm-l fm-l--after" d="M24 1300V1314" marker-end="url(#fm-a-m)"/><path class="fm-l fm-l--after" d="M24 1372V1386" marker-end="url(#fm-a-m)"/><g class="fm-save"><rect x="0" y="0" width="350" height="64" rx="12"/><text class="fm-t" x="16" y="26">Any step: Save and finish later</text><text class="fm-m" x="16" y="46">A link by email opens the next open question.</text></g><g class="fm-n fm-n--pre"><rect x="0" y="88" width="350" height="56" rx="12"/><text class="fm-t" x="16" y="113">Welcome and email</text><text class="fm-m" x="16" y="130">2 screens · not counted</text></g><g class="fm-x fm-x--sos"><rect x="40" y="154" width="270" heigh