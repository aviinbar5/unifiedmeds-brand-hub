78" y="517">Heart and blood pressure answers</text></g><g class="fm-x fm-x--sos"><rect x="40" y="538" width="270" height="50" rx="12"/><circle class="fm-xdot" cx="60" cy="563" r="8"/><rect class="fm-xbar" x="59" y="558.5" width="2" height="5.5" rx="1"/><circle class="fm-xbar" cx="60" cy="566.5" r="1.1"/><text class="fm-t" x="78" y="560">Emergency: call 911</text><text class="fm-m" x="78" y="577">Urgent signs, from any screen</text></g><g class="fm-n"><rect x="0" y="604" width="350" height="56" rx="12"/><circle class="fm-num" cx="28" cy="632" r="14"/><text class="fm-numt" x="28" y="637" text-anchor="middle">3</text><text class="fm-t" x="52" y="629">Medications</text><text class="fm-m" x="52" y="646">5 screens</text></g><g class="fm-x"><rect x="40" y="670" width="270" height="50" rx="12"/><circle class="fm-xdot" cx="60" cy="695" r="8"/><rect class="fm-xbar" x="59" y="690.5" width="2" height="5.5" rx="1"/><circle class="fm-xbar" cx="60" cy="698.5" r="1.1"/><text class="fm-t" x="78" y="692">Not eligible online</text><text class="fm-m" x="78" y="709">Age, sex at birth, nitrates</text></g><g class="fm-n"><rect x="0" y="736" width="350" height="56" rx="12"/><circle class="fm-num" cx="28" cy="764" r="14"/><text class="fm-numt" x="28" y="769" text-anchor="middle">4</text><text class="fm-t" x="52" y="761">Your main concern</text><text class="fm-m" x="52" y="778">7 screens</text></g><g class="fm-x fm-x--sos"><rect x="40" y="802" width="270" height="50" rx="12"/><circle class="fm-xdot" cx="60" cy="827" r="8"/><rect class="fm-xbar" x="59" y="822.5" width="2" height="5.5" rx="1"/><circle class="fm-xbar" cx="60" cy="830.5" r="1.1"/><text class="fm-t" x="78" y="824">Emergency: call 911</text><text class="fm-m" x="78" y="841">Urgent signs, from any screen</text></g><g class="fm-n"><rect x="0" y="868" width="350" height="56" rx="12"/><circle class="fm-num" cx="28" cy="896" r="14"/><text class="fm-numt" x="28" y="901" text-anchor="middle">5</text><text class="fm-t" x="52" y="893">Preferences</text><text class="fm-m" x="52" y="910">4 screens</text></g><g class="fm-n"><rect x="0" y="940" width="350" height="56" rx="12"/><circle class="fm-num" cx="28" cy="968" r="14"/><text class="fm-numt" x="28" y="973" text-anchor="middle">6</text><text class="fm-t" x="52" y="965">Consent and account</text><text class="fm-m" x="52" y="982">2 screens</text></g><g class="fm-n"><rect x="0" y="1012" width="350" height="56" rx="12"/><circle class="fm-num" cx="28" cy="1040" r="14"/><text class="fm-numt" x="28" y="1045" text-anchor="middle">7</text><text class="fm-t" x="52" y="1037">Plan and send</text><text class="fm-m" x="52" y="1054">plan, checkout, ID, send</text></g><g class="fm-x"><rect x="40" y="1078" width="270" height="50" rx="12"/><circle class="fm-xdot" cx="60" cy="1103" r="8"/><rect class="fm-xbar" x="59" y="1098.5" width="2" height="5.5" rx="1"/><circle class="fm-xbar" cx="60" cy="1106.5" r="1.1"/><text class="fm-t" x="78" y="1100">Not available in your state</text><text class="fm-m" x="78" y="1117">Inline on the state screen (E-05), then Notify me</text></g><g class="fm-n fm-n--send"><rect x="0" y="1144" width="350" height="56" rx="12"/><text class="fm-t" x="16" y="1169">Send to your provider</text><text class="fm-m" x="16" y="1186">the one Yellow button</text></g><text class="fm-h" x="0" y="1230">After Send</text><g class="fm-n fm-n--after"><rect x="0" y="1244" width="350" height="56" rx="12"/><text class="fm-t" x="16" y="1269">Provider review</text><text class="fm-m" x="16" y="1286">[time · operations, R-68]</text></g><g class="fm-n fm-n--after"><rect x="0" y="1316" width="350" height="56" rx="12"/><text class="fm-t" x="16" y="1341">Pharmacy</text><text class="fm-m" x="16" y="1358">[partner · operations]</text></g><g class="fm-n fm-n--after"><rect x="0" y="1388" width="350" height="56" rx="12"/><text class="fm-t" x="16" y="1413">Delivery</text><text class="fm-m" x="16" y="1430">packed with care · [time]</text></g></svg>
