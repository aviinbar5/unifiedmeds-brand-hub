<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Next-steps card, 6 by 4 in landscape: What comes next, three steps, the sign-in address and a QR placeholder"><rect width="600" height="400" fill="#FEFCF6"/><text x="40" y="76" font-family="DM Serif Display, Georgia, serif" font-size="32" font-weight="400" fill="#1C3742" text-anchor="start">What comes next.</text><line x1="40" y1="112" x2="190" y2="112" stroke="#264653" stroke-width="1.5"/><text x="40" y="140" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#55747F" text-anchor="start">01</text><text x="40" y="166" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600" fill="#1C3742" text-anchor="start">Settle in.</text><text x="40" y="190" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#264653" text-anchor="start">Your provider is a</text><text x="40" y="210" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#264653" text-anchor="start">message away in</text><text x="40" y="230" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#264653" text-anchor="start">your account.</text><line x1="216" y1="112" x2="366" y2="112" stroke="#264653" stroke-width="1.5"/><text x="216" y="140" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#55747F" text-anchor="start">02</text><text x="216" y="166" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600" fill="#1C3742" text-anchor="start">Check in.</text><text x="216" y="190" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#264653" text-anchor="start">[Check-in timing</text><text x="216" y="210" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#264653" text-anchor="start">from the clinical</text><text x="216" y="230" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#264653" text-anchor="start">team]</text><line x1="392" y1="112" x2="542" y2="112" stroke="#264653" stroke-width="1.5"/><text x="392" y="140" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#55747F" text-anchor="start">03</text><text x="392" y="166" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600" fill="#1C3742" text-anchor="start">Refills.</text><text x="392" y="190" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#264653" text-anchor="start">Your provider reviews</text><text x="392" y="210" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#264653" text-anchor="start">your plan before</text><text x="392" y="230" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#264653" text-anchor="start">each refill.</text><line x1="40" y1="266" x2="560" y2="266" stroke="#E3DFD5" stroke-width="1"/><text x="40" y="304" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#264653" text-anchor="start">Your account holds your plan,</text><text x="40" y="324" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#264653" text-anchor="start">your messages and your orders.</text><text x="40" y="352" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#1C3742" text-anchor="start">[sign-in address]</text><rect x="472" y="282" width="88" height="88" rx="4" fill="none" stroke="#55747F" stroke-width="1.5" stroke-dasharray="5 4"/><text x="516" y="322" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="400" fill="#55747F" text-anchor="middle">[QR to</text><text x="516" y="337" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="400" fill="#55747F" text-anchor="middle">sign-in]</text></svg>
