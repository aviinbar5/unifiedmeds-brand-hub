<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Assessment Flow Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: split screen. Left = the step companion (one standing capsule that is both the step icon and the progress). Right = one question at a time. Single light theme on purpose: it mirrors the brand's Paper ground. */
:root{
  --paper:#FEFCF6; --card:#FFFFFF; --mist:#E8E7E1; --teal:#264653; --teal-deep:#1C3742;
  --text2:#55747F; --text3:#7E9AA6; --line:#E3DFD5; --line-soft:#EDEAE2; --line-field:#55747F;
  --wash-green:#B6CDBB; --wash-yellow:#FCE7AE; --yellow:#FFBE0B; --coral:#E76F51; --green:#6A8670; --blue:#6E8B97;
  --serif:"DM Serif Display", Georgia, serif; --sans:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --e-out:cubic-bezier(.22,1,.36,1); --e-in:cubic-bezier(.4,0,.6,1); color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--teal);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:80px;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding-left:max(56px,env(safe-area-inset-left,0px));padding-right:max(56px,env(safe-area-inset-right,0px));background:var(--paper);border-bottom:1px solid var(--line-soft)}
.top .logo svg{height:40px;width:auto;display:block}
.top nav{display:flex;gap:24px;align-items:center;font-weight:500}
.top nav a{color:var(--teal);text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.top nav a.u{text-decoration:underline;text-underline-offset:4px}
.tag{font-size:12px;font-weight:600;letter-spacing:.02em;padding:3px 10px;border-radius:999px;background:var(--mist);color:var(--text2)}
.app{display:grid;grid-template-columns:280px minmax(0,1fr);gap:72px;max-width:1240px;margin:0 auto;min-height:calc(100% - 80px);padding-left:max(56px,env(safe-area-inset-left,0px));padding-right:max(56px,env(safe-area-inset-right,0px))}
/* companion */
.side{position:sticky;top:calc(80px + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - 80px);padding:48px 40px 32px 0;display:flex;flex-direction:column;gap:24px;border-right:1px solid var(--line-soft)}
.cap-wrap{position:relative;width:168px;height:168px;margin-left:-24px}
.cap-wrap svg{width:100%;height:100%;display:block;overflow:visible}
.cap-line{fill:none;stroke:var(--teal);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.cap-fill{fill:var(--wash-green)}
#clipRect{transition:y 520ms var(--e-out),height 520ms var(--e-out)}
.glyph{transform-box:fill-box;transform-origin:center;transition:opacity 220ms var(--e-in),transform 220ms var(--e-in),filter 220ms var(--e-in)}
.glyph.out{opacity:0;transform:scale(.82);filter:blur(1.2px)}
.glyph.drawin{animation:glyphIn 520ms var(--e-out) both}
@keyframes glyphIn{from{stroke-dashoffset:var(--glen);opacity:.2;transform:scale(.92)}to{stroke-dashoffset:0;opacity:1;transform:none}}
.cap-wrap svg{transition:transform 520ms var(--e-out)}
.cap-wrap.breathe svg{animation:breathe 520ms var(--e-out)}
@keyframes breathe{40%{transform:scale(1.03)}100%{transform:none}}
#stepText{transition:opacity 220ms var(--e-in),transform 220ms var(--e-in),filter 220ms var(--e-in)}
#stepText.out{opacity:0;transform:translateY(-6px);filter:blur(2px)}
#stepText.in{animation:softIn 320ms var(--e-out) both}
@keyframes softIn{from{opacity:0;transform:translateY(10px);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
.step-eyebrow{font-weight:600;font-size:13px;color:var(--text2);letter-spacing:.02em}
.step-name{font:400 clamp(28px,2.6vw,34px)/1.15 var(--serif);margin:4px 0 8px;text-wrap:balance}
.step-note{color:var(--text2);max-width:34ch;margin:0}
.rail{list-style:none;margin:auto 0 0;padding:0;display:grid;gap:2px}
.rail li{display:flex;align-items:center;gap:12px;min-height:34px;font-size:14px;opacity:.5;transition:opacity 220ms var(--e-out)}
.rail li.passed,.rail li.active{opacity:1}
.rail li.active{font-weight:600}
.rail .n{width:24px;height:24px;border-radius:50%;border:1px solid var(--teal);display:grid;place-items:center;font-size:11px;font-weight:600;flex:none;transition:background 220ms var(--e-out),border-color 220ms var(--e-out),color 220ms}
.rail li.active .n{background:var(--teal);color:var(--paper)}
.rail li.passed .n{background:var(--wash-green);border-color:var(--wash-green)}
.private{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--text2)}
/* main */
.main{display:flex;flex-direction:column;padding:48px 0 32px;min-width:0}
.prog{display:flex;align-items:center;gap:12px;min-height:44px;margin-bottom:24px}
.prog svg{width:56px;height:auto;flex:none}
.prog[hidden]{display:none}
.prog .lbl{color:var(--text2);font-size:15px}
.prog .lbl b{color:var(--teal);font-weight:600}
.stage{position:relative;flex:1;max-width:680px}
.q>*{animation:rise 320ms var(--e-out) both}
.q>*:nth-child(2){animation-delay:60ms}
.q>*:nth-child(n+3){animation-delay:120ms}
.q .opt{animation:rise 320ms var(--e-out) both;animation-delay:calc(160ms + var(--i,0) * 40ms)}
.q.leaving>*,.q.leaving .opt{animation:leave 220ms var(--e-in) both;animation-delay:0ms}
@keyframes rise{from{opacity:0;transform:translateY(12px);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
@keyframes leave{to{opacity:0;transform:translateY(-8px);filter:blur(2px)}}
.q h1{font:400 clamp(30px,3.2vw,44px)/1.15 var(--serif);margin:0 0 12px;text-wrap:balance}
.q .help{color:var(--text2);margin:0 0 28px;max-width:58ch}
.opts{display:grid;gap:12px}
.opts.two{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.opt{position:relative;display:flex;align-items:center;gap:16px;width:100%;text-align:left;min-height:64px;padding:14px 18px;background:var(--card);
  border:1px solid var(--line);border-radius:16px;cursor:pointer;transition:border-color 150ms var(--e-out),background 150ms var(--e-out),transform 150ms var(--e-out),box-shadow 150ms var(--e-out)}
.opt:hover{border-color:var(--line-field);transform:translateY(-1px);box-shadow:0 6px 18px -12px rgba(38,70,83,.35)}
.opt .key{flex:none;width:28px;height:28px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--text2);transition:all 150ms var(--e-out)}
.opt .t{flex:1;min-width:0}
.opt .t b{display:block;font-weight:600}
.opt .t span{display:block;color:var(--text2);font-size:14px}
.opt .mark{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-field);display:grid;place-items:center;transition:all 150ms var(--e-out)}
.opt.multi .mark{border-radius:5px}
.opt .dot{width:10px;height:10px;border-radius:50%;flex:none}
.opt[aria-checked="true"].single{background:var(--teal);border-color:var(--teal);color:var(--paper)}
.opt[aria-checked="true"].single .t span{color:#D5E0E3}
.opt[aria-checked="true"].single .key{border-color:rgba(254,252,246,.35);color:var(--paper)}
.opt[aria-checked="true"].single .mark{background:var(--yellow);border-color:var(--yellow)}
.opt[aria-checked="true"].multi{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
.opt[aria-checked="true"].multi .mark{background:var(--teal);border-color:var(--teal)}
.opt[aria-checked="true"] .mark svg{opacity:1;transform:scale(1)}
.opt .mark svg{width:14px;height:14px;opacity:0;transform:scale(.6);transition:all 150ms var(--e-out)}
.opts.err .opt:not([aria-checked="true"]):not(.optional){border-color:var(--coral)}
.opt.multi .mark{color:var(--paper)}
.err-msg{display:none;align-items:center;gap:8px;margin-top:14px;font-size:14px}
.err-msg.on{display:flex}
.err-msg i{width:16px;height:16px;border-radius:50%;background:var(--coral);flex:none;display:grid;place-items:center;color:#fff;font:700 11px/1 var(--sans);font-style:normal}
.fields{display:grid;gap:16px;max-width:520px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:12px}
label.f{display:grid;gap:6px;font-size:14px;color:var(--text2)}
.f input,.f select{height:52px;border:1px solid var(--line-field);border-radius:12px;padding:0 16px;font:16px var(--sans);color:var(--teal);background:var(--card);transition:box-shadow 150ms var(--e-out)}
.f input:focus,.f select:focus{outline:none;border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal),0 0 0 3px rgba(38,70,83,.15)}
.note{font-size:13px;color:var(--text2)}
.info{display:flex;gap:12px;background:var(--mist);border-radius:12px;padding:14px 16px;margin-top:16px;animation:rise 220ms var(--e-out) both}
.info b{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.sos{background:var(--wash-yellow);border-radius:12px;padding:14px 16px;margin-top:20px}
.list{display:grid;gap:10px;margin:0 0 8px;padding:0;list-style:none}
.list li{display:flex;gap:10px;align-items:flex-start}
.list svg{flex:none;margin-top:3px}
.review{display:grid;gap:12px}
.review .card{display:grid;gap:4px}
.review .head{display:flex;justify-content:space-between;align-items:center}
.review .head button{background:none;border:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-weight:500;min-height:44px}
.review .v{color:var(--text2);font-size:14px}
.actions{display:flex;gap:12px;align-items:center;margin-top:32px;flex-wrap:wrap}
.btn{min-height:48px;padding:0 24px;border-radius:12px;border:1px solid var(--teal);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:10px;transition:background 150ms var(--e-out),opacity 150ms}
.btn.primary{background:var(--teal);color:var(--paper)}
.btn.primary:hover{background:var(--teal-deep)}
.btn.ghost{background:transparent;color:var(--teal)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.hint{font-size:13px;color:var(--text3);margin-left:4px}
.hint kbd{font:600 12px var(--sans);border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:var(--card);color:var(--text2)}
.legal{margin-top:auto;padding-top:40px;font-size:12px;color:var(--text2)}
.legal a{color:var(--teal)}
.toast{position:fixed;right:max(24px,env(safe-area-inset-right,0px));top:calc(96px + env(safe-area-inset-top,0px));transform:translate(0,-8px);opacity:0;background:var(--teal);color:var(--paper);
  padding:12px 18px;border-radius:999px;display:flex;gap:10px;align-items:center;font-weight:500;font-size:14px;pointer-events:none;transition:opacity 220ms var(--e-out),transform 220ms var(--e-out);z-index:20}
.toast.on{opacity:1;transform:translate(0,0)}
.toast .ok{width:20px;height:20px;border-radius:50%;background:var(--wash-green);display:grid;place-items:center}
.done-wrap{text-align:left}
.steps3{list-style:none;padding:0;margin:20px 0 0;display:grid;gap:14px;counter-reset:s}
.steps3 li{display:flex;gap:14px;align-items:flex-start}
.steps3 li::before{counter-increment:s;content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--teal);display:grid;place-items:center;font-size:12px;font-weight:600}
@media (max-width:860px){
  .top{height:64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .top .logo svg{height:30px}
  .top nav a:not(.u){display:none}
  .top nav .long{display:none}
  .prog{display:none}
  .top .tag{display:none}
  .app{grid-template-columns:1fr;gap:0;padding-left:0;padding-right:0}
  .side{position:static;height:auto;flex-direction:row;align-items:center;gap:14px;padding:12px max(16px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line-soft)}
  .cap-wrap{width:64px;height:64px;margin:0;flex:none}
  .step-name{font-size:22px;margin:0}
  .step-note,.rail,.private{display:none}
  .main{padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
  .q h1{font-size:26px;line-height:1.3}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important}
}
</style>

function toast(t){const el=$("#toast");$("#toastTxt").textContent=t;el.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("on"),1600)}
function actions(label,opts={}){return `<div class="actions">${i>0?'<button class="btn ghost" data-act="back" type="button">Back</button>':''}<button class="btn primary" data-act="next" type="button" ${opts.disabled?'disabled':''}>${label} <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>${opts.hint?`<span class="hint">${opts.hint}</span>`:''}</div>`}
function render(){
  const s=SCREENS[i]; let h="";
  if(s.type==="intro"){h=`<h1>Let's start your assessment.</h1><p class="help">A few questions about your health, then a licensed provider reviews your answers and decides if a treatment is right for you.</p>
   <ul class="list"><li>${tick()}Takes [about N minutes · O-12]. You can save and finish later.</li><li>${tick()}Only your provider and care team read your answers.</li><li>${tick()}[charge line · operations]</li></ul>
   <div class="sos"><b>Is this an emergency?</b><br>If you have chest pain, trouble breathing or another emergency, call 911 now. Don't use this assessment.</div>${actions("Start",{hint:"or press <kbd>Enter</kbd>"})}`}
  if(s.type==="email"){h=`<h1>Where can we save your answers?</h1><p class="help">We save each answer as you go. If you stop, we email you a link to come back. There's no password.</p>
   <div class="fields"><label class="f">Email<input id="email" type="email" autocomplete="email" inputmode="email" placeholder="name@example.com" value="${A.email||''}"></label><span class="note">The email won't say what it's about.</span></div>${actions("Continue",{hint:"<kbd>Enter</kbd>"})}`}
  if(s.type==="state"){h=`<h1>Which state are you in right now?</h1><p class="help">Providers can only treat you in a state where they hold a license.</p>
   <div class="fields"><label class="f">State<select id="state"><option value="">Choose your state</option>${["Arizona","California","Florida","New York","Ohio","Texas","Alaska"].map(x=>`<option ${A.state===x?'selected':''}>${x}</option>`).join("")}</select></label><span class="note">Demo: choose Alaska to see a state we don't serve yet.</span><div id="stateMsg"></div></div>${actions("Continue")}`}
  if(s.type==="dob"){const d=A.dob||{};h=`<h1>What is your date of birth?</h1><p class="help">Medicines and doses depend on age.</p>
   <div class="fields"><div class="row"><label class="f">Month<input id="mm" inputmode="numeric" maxlength="2" placeholder="MM" value="${d.m||''}"></label><label class="f">Day<input id="dd" inputmode="numeric" maxlength="2" placeholder="DD" value="${d.d||''}"></label><label class="f">Year<input id="yy" inputmode="numeric" maxlength="4" placeholder="YYYY" value="${d.y||''}"></label></div><span class="note">Each box moves you to the next when it's full.</span></div>${actions("Continue",{hint:"<kbd>Enter</kbd>"})}`}
  if(s.type==="single"||s.type==="multi"){const sel=A[s.id]||(s.type==="multi"?[]:null);
   h=`<h1>${s.q}</h1>${s.help?`<p class="help">${s.help}</p>`:'<p class="help"></p>'}<div class="opts ${s.two?'two':''}" role="${s.type==="single"?'radiogroup':'group'}" aria-label="${s.q}">${s.opts.map((o,k)=>{const on=s.type==="single"?sel===k:sel.includes(k);
     const dot=o[2]==="green"?'<span class="dot" style="background:#6A8670"></span>':o[2]==="blue"?'<span class="dot" style="background:#6E8B97"></span>':'';
     return `<button type="button" style="--i:${k}" class="opt ${s.type}" role="${s.type==="single"?'radio':'checkbox'}" aria-checked="${on}" data-k="${k}"><span class="key">${String.fromCharCode(65+k)}</span>${dot}<span class="t"><b>${o[0]}</b>${o[1]?`<span>${o[1]}</span>`:''}</span><span class="mark">${CHECK}</span></button>`}).join("")}</div>
     <div class="err-msg" id="err"><i>!</i>Choose an answer to go on.</div>${actions("Continue",{hint:s.type==="single"?"Press a letter, it moves on by itself":"Press letters to choose, <kbd>Enter</kbd> to go on"})}`}
  if(s.type==="consent"){const c=A.consent||[];const L=[["I agree to the treatment consent.","[Treatment consent summary · legal and clinical team]"],["I agree to receive care through telehealth.","Telehealth consent"],["I've read the Privacy notice and agree to the Terms.",""],["Text me about my care (optional).","[SMS consent wording · legal]"]];
   h=`<h1>Before your provider sees your answers.</h1><p class="help">Read and agree to these. Each one opens in a new window.</p><div class="opts" role="group" aria-label="Consents">${L.map((o,k)=>`<button type="button" style="--i:${k}" class="opt multi${k===3?' optional':''}" role="checkbox" aria-checked="${c.includes(k)}" data-k="${k}"><span class="key">${String.fromCharCode(65+k)}</span><span class="t"><b>${o[0]}</b>${o[1]?`<span>${o[1]}</span>`:''}</span><span class="mark">${CHECK}</span></button>`).join("")}</div>
   <div class="err-msg" id="err"><i>!</i>Tick the first three to go on.</div>${actions("Continue")}`}
  if(s.type==="review"){const st=A.state||"Ohio",d=A.dob?`${A.dob.m}/${A.dob.d}/${A.dob.y}`:"02/14/1978";const pick=(id)=>{const sc=SCREENS.find(x=>x.id===id);const v=A[id];if(v==null||(Array.isArray(v)&&!v.length))return"Not answered";return Array.isArray(v)?v.map(k=>sc.opts[k][0]).join(", "):sc.opts[v][0]};
   const rows=[["About you","state",[["State",st],["Date of birth",d],["Sex assigned at birth",pick("sex")]]],["Health history","bp",[["Blood pressure",pick("bp")]]],["Medications","nitrates",[["These medicines",pick("nitrates")]]],["Your main concern","concern",[["Help with",pick("concern")],["How long",pick("duration")]]],["Preferences","pref",[["How to take it",pick("pref")]]]];
   h=`<h1>Check your answers before you send them.</h1><p class="help">Your provider reads what you see here. Edit any step before you send.</p><div class="review">${rows.map(r=>`<div class="card"><div class="head"><b>${r[0]}</b><button type="button" data-edit="${r[1]}">Edit</button></div>${r[2].map(x=>`<div class="v">${x[0]} · ${x[1]}</div>`).join("")}</div>`).join("")}</div>${actions("Send to your provider")}`}
  if(s.type==="sent"){h=`<div class="done-wrap"><h1>Sent. Your provider takes it from here.</h1><p class="help">We'll email you when your provider has reviewed your answers. The email won't say what it's about.</p>
   <ol class="steps3"><li><span><b>Provider review</b><br><span class="note">[time · operations]</span></span></li><li><span><b>Pharmacy</b>, only if your provider prescribes<br><span class="note">[partner · operations]</span></span></li><li><span><b>A plain package</b>, nothing on the outside about what's inside<br><span class="note">[time · operations]</span></span></li></ol>
   <div class="actions"><button class="btn primary" type="button" data-act="restart">Start the demo again</button></div></div>`}
  const old=stage.firstElementChild;
  const mount=()=>{stage.innerHTML=`<div class="q">${h}</div>`;wire(s);const f=stage.querySelector("input,select,.opt,.btn.primary");if(f&&s.type!=="intro")f.focus({preventScroll:true})};
  setGlyph(s.icon);
  if(old){old.classList.add("leaving");setTimeout(mount,220)}else mount();
  if(s.step!==lastStep){const prev=lastStep;companion(s.step);if(s.step>prev&&prev>0&&prev<=7)toast(`Step ${prev} done · ${STEPS[prev-1].name}`);lastStep=s.step;
    const cap=$("#cap");cap.classList.remove("breathe");void cap.offsetWidth;cap.classList.add("breathe");}
}
function tick(){return '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" fill="#B6CDBB"/><path d="M4.8 8.2L7 10.4L11.2 5.8" stroke="#264653" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'}
function go(d){i=Math.max(0,Math.min(SCREENS.length-1,i+d));render()}
function wire(s){
  stage.querySelectorAll("[data-act=back]").forEach(b=>b.onclick=()=>go(-1));
  stage.querySelectorAll("[data-act=restart]").forEach(b=>b.onclick=()=>{for(const k in A)delete A[k];i=0;lastStep=-1;render()});
  stage.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{i=SCREENS.findIndex(x=>x.id===b.dataset.edit);render()});
  const next=stage.querySelector("[data-act=next]");
  const err=stage.querySelector("#err"), opts=stage.querySelector(".opts");
  const clearErr=()=>{if(err){err.classList.remove("on");opts&&opts.classList.remove("err")}};
  const showErr=()=>{err.classList.add("on");opts.classList.add("err")};
  if(s.type==="single"||s.type==="multi"||s.type==="consent"){
    stage.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(s,+b.dataset.k));
  }
  if(s.type==="state"){const sel=stage.querySelector("#state");const upd=()=>{A.state=sel.value;const m=stage.querySelector("#stateMsg");const no=sel.value==="Alaska";
    m.innerHTML=no?`<div class="info"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="8.25" stroke="#264653" stroke-width="1.5"/><path d="M10 9v5M10 6.2v.1" stroke="#264653" stroke-width="1.5" stroke-linecap="round"/></svg><div><b>We can't offer care in Alaska.</b>Providers need a license in your state, so the assessment can't go on from here. If you chose the wrong state, change it.<div style="margin-top:10px"><button class="btn ghost" type="button">Notify me when care opens</button></div></div></div>`:"";
    next.disabled=no;};sel.onchange=upd;upd();}
  if(s.type==="dob"){const ids=["mm","dd","yy"],lens=[2,2,4];ids.forEach((id,k)=>{const el=stage.querySelector("#"+id);el.oninput=()=>{el.value=el.value.replace(/\D/g,"");if(el.value.length>=lens[k]&&k<2)stage.querySelector("#"+ids[k+1]).focus()}})}
  if(next)next.onclick=()=>{
    if(s.type==="email"){A.email=stage.querySelector("#email").value}
    if(s.type==="dob"){A.dob={m:stage.querySelector("#mm").value||"02",d:stage.querySelector("#dd").value||"14",y:stage.querySelector("#yy").value||"1978"}}
    if(s.type==="single"&&A[s.id]==null){showErr();return}
    if(s.type==="multi"&&!(A[s.id]||[]).length){showErr();return}
    if(s.type==="consent"&&![0,1,2].every(k=>(A.consent||[]).includes(k))){showErr();return}
    go(1)};
  s._clear=clearErr;
}
function pick(s,k){
  const id=s.type==="consent"?"consent":s.id;
  if(s.type==="single"){A[id]=k;}
  else{let v=A[id]||[];const excl=s.opts&&s.opts[k]&&s.opts[k][2]===true;
    if(excl)v=v.includes(k)?[]:[k];else{v=v.filter(x=>!(s.opts&&s.opts[x]&&s.opts[x][2]===true));v=v.includes(k)?v.filter(x=>x!==k):[...v,k]}A[id]=v;}
  stage.querySelectorAll(".opt").forEach(b=>{const kk=+b.dataset.k;b.setAttribute("aria-checked",s.type==="single"?kk===A[id]:(A[id]||[]).includes(kk))});
  s._clear&&s._clear();
  if(s.type==="single"){clearTimeout(pick.t);pick.t=setTimeout(()=>{if(SCREENS[i]===s)go(1)},320)}
}
document.addEventListener("keydown",e=>{
  const s=SCREENS[i]; const tg=e.target; if(tg&&tg.matches&&tg.matches("input,select")&&e.key!=="Enter")return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="Enter"){const n=stage.querySelector("[data-act=next]");if(n&&!n.disabled){e.preventDefault();n.click()}return}
  const k=e.key.toUpperCase().charCodeAt(0)-65;
  if(e.key.length===1&&(s.type==="single"||s.type==="multi"||s.type==="consent")){const n=stage.querySelectorAll(".opt").length;if(k>=0&&k<n){e.preventDefault();pick(s,k)}}
});
// the shell draw length
(function(){const p=$("#shell");try{const L=p.getTotalLength();$("#cap").style.setProperty("--len",L)}catch(e){$("#cap").style.setProperty("--len",LEN)}})();
lastStep=-1;render();
</script>
