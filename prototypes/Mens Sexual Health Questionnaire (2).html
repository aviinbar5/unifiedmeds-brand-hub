<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Mens Sexual Health Questionnaire (2)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one centred page. Left column = the step companion (a standing capsule that is the step icon and the progress), right column = one question at a time, with its follow-ups opening inline. Single light theme on purpose (the brand's Paper ground). */
:root{
  --paper:#FEFCF6; --card:#FFFFFF; --mist:#E8E7E1; --teal:#264653; --teal-deep:#1C3742;
  --text2:#55747F; --text3:#7E9AA6; --line:#E3DFD5; --line-soft:#EDEAE2; --line-field:#55747F;
  --wash-green:#B6CDBB; --wash-yellow:#FCE7AE; --wash-blue:#A8BEC7; --yellow:#FFBE0B; --coral:#E76F51; --green:#6A8670; --blue:#6E8B97;
  --serif:"DM Serif Display", Georgia, serif; --sans:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --e-out:cubic-bezier(.22,1,.36,1); --e-in:cubic-bezier(.4,0,.6,1); --b:3px; --rise:12px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--paper);color:var(--teal);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;height:80px;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding-left:max(56px,env(safe-area-inset-left,0px));padding-right:max(56px,env(safe-area-inset-right,0px));background:var(--paper);border-bottom:1px solid var(--line-soft)}
.top .logo svg{height:40px;width:auto;display:block}
.top nav{display:flex;gap:20px;align-items:center;font-weight:500}
.top nav a{color:var(--teal);text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.top nav a.u{text-decoration:underline;text-underline-offset:4px}
.tag{font-size:12px;font-weight:600;letter-spacing:.02em;padding:3px 10px;border-radius:999px;background:var(--mist);color:var(--text2)}
.devbtn{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;color:var(--text2);cursor:pointer}
.devbtn[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--paper)}
.app{display:grid;grid-template-columns:280px minmax(0,1fr);gap:72px;max-width:1240px;margin:0 auto;padding-left:max(56px,env(safe-area-inset-left,0px));padding-right:max(56px,env(safe-area-inset-right,0px))}
/* companion */
.side{position:sticky;top:calc(80px + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - 80px);padding:48px 40px 32px 0;display:flex;flex-direction:column;gap:24px;border-right:1px solid var(--line-soft)}
.cap-wrap{position:relative;width:168px;height:168px;margin-left:-24px;flex:none}
.cap-wrap svg{width:100%;height:100%;display:block;overflow:visible}
.cap-line{fill:none;stroke:var(--teal);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.cap-fill{fill:var(--wash-green)}
#clipRect{transition:y 520ms var(--e-out),height 520ms var(--e-out)}
.glyph{transform-box:fill-box;transform-origin:center;transition:opacity 220ms var(--e-in),transform 220ms var(--e-in)}
.glyph.out{opacity:0;transform:scale(.82)}
.glyph.drawin{animation:glyphIn 520ms var(--e-out) both}
@keyframes glyphIn{from{stroke-dashoffset:var(--glen);opacity:.2;transform:scale(.92)}to{stroke-dashoffset:0;opacity:1;transform:none}}
.cap-wrap.breathe svg{animation:breathe 520ms var(--e-out)}
@keyframes breathe{40%{transform:scale(1.03)}100%{transform:none}}
#stepText{transition:opacity 220ms var(--e-in),transform 220ms var(--e-in)}
#stepText.out{opacity:0;transform:translateY(-6px)}
#stepText.in{animation:softIn 320ms var(--e-out) both}
@keyframes softIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.step-eyebrow{font-weight:600;font-size:13px;color:var(--text2);letter-spacing:.02em}
.step-name{font:400 clamp(28px,2.6vw,34px)/1.15 var(--serif);margin:4px 0 8px;text-wrap:balance}
.step-note{color:var(--text2);max-width:34ch;margin:0}
.rail{list-style:none;margin:auto 0 0;padding:0;display:grid;gap:2px}
.rail li{display:flex;align-items:center;gap:12px;min-height:34px;font-size:14px;opacity:.5;transition:opacity 220ms var(--e-out)}
.rail li.passed,.rail li.active{opacity:1}
.rail li.active{font-weight:600}
.rail .n{width:24px;height:24px;border-radius:50%;border:1px solid var(--teal);display:grid;place-items:center;font-size:11px;font-weight:600;flex:none;transition:background 220ms var(--e-out),border-color 220ms var(--e-out),color 220ms}
.rail li.active .n{background:var(--teal);color:var(--paper)}
.rail li.passed .n{background:var(--wash-green);border-color:var(--wash-green)}
.private{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--text2)}
.mstrip{display:none}
/* main */
.main{display:flex;flex-direction:column;padding:48px 0 32px;min-width:0}
.prog{display:flex;align-items:center;gap:12px;min-height:44px;margin-bottom:24px}
.prog[hidden]{display:none}
.prog svg{width:56px;height:auto;flex:none}
.prog .lbl{color:var(--text2);font-size:15px}
.prog .lbl b{color:var(--teal);font-weight:600}
.stage{position:relative;flex:1;max-width:680px}
.q>*{animation:rise 320ms var(--e-out) both}
.q>*:nth-child(2){animation-delay:60ms}
.q>*:nth-child(n+3){animation-delay:120ms}
.q .opt{animation:rise 320ms var(--e-out) both;animation-delay:calc(140ms + var(--i,0) * 30ms)}
.q.leaving>*,.q.leaving .opt{animation:leave 220ms var(--e-in) both;animation-delay:0ms}
@keyframes rise{from{opacity:0;transform:translate3d(0,var(--rise),0);filter:blur(var(--b))}to{opacity:1;transform:none;filter:none}}
@keyframes leave{to{opacity:0;transform:translate3d(0,-8px,0)}}
.q h1{font:400 clamp(28px,3vw,40px)/1.18 var(--serif);margin:0 0 12px;text-wrap:balance}
.q .help{color:var(--text2);margin:0 0 24px;max-width:60ch}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.opt{position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-height:60px;padding:12px 16px;background:var(--card);
  border:1px solid var(--line);border-radius:16px;cursor:pointer;transition:border-color 150ms var(--e-out),background 150ms var(--e-out),transform 150ms var(--e-out),box-shadow 150ms var(--e-out)}
@media (hover:hover){.opt:hover{border-color:var(--line-field);transform:translateY(-1px);box-shadow:0 6px 18px -12px rgba(38,70,83,.35)}}
.opt:active{transform:scale(.99)}
.opt .key{flex:none;width:26px;height:26px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--text2);transition:all 150ms var(--e-out)}
.opt .t{flex:1;min-width:0}
.opt .t b{display:block;font-weight:500}
.opt .mark{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-field);display:grid;place-items:center;transition:all 150ms var(--e-out);color:var(--teal)}
.opt.multi .mark{border-radius:5px;color:var(--paper)}
.opt[aria-checked="true"].single{background:var(--teal);border-color:var(--teal);color:var(--paper)}
.opt[aria-checked="true"].single .key{border-color:rgba(254,252,246,.35);color:var(--paper)}
.opt[aria-checked="true"].single .mark{background:var(--yellow);border-color:var(--yellow)}
.opt[aria-checked="true"].multi{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
.opt[aria-checked="true"].multi .mark{background:var(--teal);border-color:var(--teal)}
.opt .mark svg{width:14px;height:14px;opacity:0;transform:scale(.6);transition:all 150ms var(--e-out)}
.opt[aria-checked="true"] .mark svg{opacity:1;transform:scale(1)}
.err .opt:not([aria-checked="true"]):not(.optional){border-color:var(--coral)}
.err-msg{display:none;align-items:center;gap:8px;margin-top:12px;font-size:14px}
.err-msg.on{display:flex}
.err-msg i{width:16px;height:16px;border-radius:50%;background:var(--coral);flex:none;display:grid;place-items:center;color:#fff;font:700 11px/1 var(--sans);font-style:normal}
/* follow-ups open inline */
.fu{display:grid;grid-template-rows:0fr;transition:grid-template-rows 320ms var(--e-out),opacity 220ms var(--e-out),margin 320ms var(--e-out);opacity:0;margin-top:0}
.fu.open{grid-template-rows:1fr;opacity:1;margin-top:16px}
.fu>.fu-in{overflow:hidden;min-height:0}
.fu-card{border-left:2px solid var(--wash-green);padding:4px 0 4px 18px;display:grid;gap:12px}
.fu-card .fq{font-weight:600;font-size:16px;line-height:1.45}
.fu-card .opts{gap:8px}
.fu-card .opt{min-height:52px}
textarea,input.tx{width:100%;border:1px solid var(--line-field);border-radius:12px;padding:12px 14px;font:16px/1.5 var(--sans);color:var(--teal);background:var(--card);resize:vertical;transition:box-shadow 150ms var(--e-out)}
input.tx{height:52px;padding:0 16px}
textarea{min-height:96px}
textarea:focus,input.tx:focus,.f input:focus,.f select:focus{outline:none;border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal),0 0 0 3px rgba(38,70,83,.15)}
.tx.bad{border-color:var(--coral)}
.fields{display:grid;gap:16px;max-width:520px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:12px}
label.f{display:grid;gap:6px;font-size:14px;color:var(--text2)}
.f input,.f select{height:52px;border:1px solid var(--line-field);border-radius:12px;padding:0 16px;font:16px var(--sans);color:var(--teal);background:var(--card)}
.note{font-size:13px;color:var(--text2)}
.info{display:flex;gap:12px;background:var(--mist);border-radius:12px;padding:14px 16px;margin-top:16px;animation:rise 220ms var(--e-out) both}
.info b{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.sos{background:var(--wash-yellow);border-radius:12px;padding:14px 16px;margin-top:20px}
.list{display:grid;gap:10px;margin:0 0 8px;padding:0;list-style:none}
.list li{display:flex;gap:10px;align-items:flex-start}
.list svg{flex:none;margin-top:3px}
.consent{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:grid;gap:10px}
.consent p{margin:0}
.more{display:grid;grid-template-rows:0fr;transition:grid-template-rows 420ms var(--e-out)}
.more.open{grid-template-rows:1fr}
.more>div{overflow:hidden;min-height:0}
.legal-doc{display:grid;gap:8px;padding-top:8px;font-size:14px}
.legal-doc h3{font:600 15px/1.4 var(--sans);margin:10px 0 0}
.legal-doc h4{font:600 14px/1.4 var(--sans);margin:6px 0 0;color:var(--text2)}
.legal-doc ul{margin:0;padding-left:20px;display:grid;gap:4px}
.linkbtn{background:none;border:0;padding:0;min-height:44px;font-weight:600;color:var(--teal);text-decoration:underline;text-underline-offset:3px;cursor:pointer;text-align:left}
.upload{border:1.5px dashed var(--line-field);border-radius:12px;padding:20px;display:grid;gap:12px;justify-items:start}
.upload .done{display:flex;gap:10px;align-items:center;font-weight:500}
.review{display:grid;gap:12px}
.review .card{display:grid;gap:4px}
.review .head{display:flex;justify-content:space-between;align-items:center}
.review .head button{background:none;border:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-weight:500;min-height:44px}
.review .v{color:var(--text2);font-size:14px}
.actions{display:flex;gap:12px;align-items:center;margin-top:28px;flex-wrap:wrap}
.btn{min-height:48px;padding:0 24px;border-radius:12px;border:1px solid var(--teal);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:background 150ms var(--e-out),opacity 150ms,transform 150ms var(--e-out)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--teal);color:var(--paper)}
@media (hover:hover){.btn.primary:hover{background:var(--teal-deep)}}
.btn.ghost{background:transparent;color:var(--teal)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.hint{font-size:13px;color:var(--text3);margin-left:4px}
.hint kbd{font:600 12px var(--sans);border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:var(--card);color:var(--text2)}
.legal{margin-top:auto;padding-top:40px;font-size:12px;color:var(--text2)}
.legal a{color:var(--teal)}
.toast{position:fixed;right:max(24px,env(safe-area-inset-right,0px));top:calc(96px + env(safe-area-inset-top,0px));transform:translate(0,-8px);opacity:0;background:var(--teal);color:var(--paper);
  padding:12px 18px;border-radius:999px;display:flex;gap:10px;align-items:center;font-weight:500;font-size:14px;pointer-events:none;transition:opacity 220ms var(--e-out),transform 220ms var(--e-out);z-index:20}
.toast.on{opacity:1;transform:translate(0,0)}
.toast .ok{width:20px;height:20px;border-radius:50%;background:var(--wash-green);display:grid;place-items:center}
.steps3{list-style:none;padding:0;margin:20px 0 0;display:grid;gap:14px;counter-reset:s}
.steps3 li{display:flex;gap:14px;align-items:flex-start}
.steps3 li::before{counter-increment:s;content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--teal);display:grid;place-items:center;font-size:12px;font-weight:600}
.quote{border-left:2px solid var(--coral);padding:6px 0 6px 14px;margin:4px 0 16px;font-weight:500}
/* developer view */
.dev{display:none}
body.devon .dev{display:block}
.dev{font:500 12px/1.5 var(--sans);color:#5B4A9E;background:#EFEDFF;border-radius:8px;padding:6px 10px;margin:0 0 10px}
.dev b{font-weight:600}
.flag{display:none;font:600 11px/1 var(--sans);letter-spacing:.02em;padding:3px 7px;border-radius:6px;margin-left:8px;vertical-align:middle}
body.devon .flag{display:inline-block}
.flag.red{background:#FBEBEB;color:#B4472F}
.flag.route{background:#F9ECE7;color:#9C3B7C}
.flag.fu{background:#E7F1FB;color:#2F5D86}
@media (max-width:860px){
  :root{--b:0px;--rise:8px}
  .top{height:64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .top .logo svg{height:28px}
  .top nav a:not(.u),.top .tag,.top nav .long{display:none}
  .app{grid-template-columns:1fr;gap:0;padding-left:0;padding-right:0}
  .side{display:none}
  .mstrip{display:flex;position:sticky;top:calc(64px + env(safe-area-inset-top,0px));z-index:5;align-items:center;gap:12px;height:56px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));background:var(--paper);border-bottom:1px solid var(--line-soft)}
  .mstrip svg{width:24px;height:24px;flex:none}
  .mstrip .ml{font-size:14px;color:var(--text2);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mstrip .ml b{color:var(--teal);font-weight:600}
  .mstrip .bar{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:transparent}
  .mstrip .bar i{display:block;height:100%;width:0;background:var(--teal);transition:width 520ms var(--e-out)}
  .prog{display:none}
  .main{padding:20px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
  .q h1{font-size:26px;line-height:1.3}
  .q .help{margin-bottom:18px}
  .opt{min-height:56px;padding:10px 14px}
  .opt .key{display:none}
  .actions{position:sticky;bottom:0;z-index:4;margin:24px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--paper);border-top:1px solid var(--line-soft);flex-wrap:nowrap}
  .actions .btn.primary{flex:1}
  .hint{display:none}
  .legal{padding:24px 0 16px}
  .toast{top:auto;bottom:calc(92px + env(safe-area-inset-bottom,0px));right:50%;transform:translate(50%,8px)}
  .toast.on{transform:translate(50%,0)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important}
}
</style>

const LEGAL={"consent": [["h1", "Consent for PT-141, Oxytocin, Apomorphine, and PDE5 Inhibitors (Men’s Libido and Erectile Function)"], ["p", "This consent and product education explains the use of compounded PT-141 (bremelanotide), oxytocin, and apomorphine, as well as phosphodiesterase type 5 inhibitors (PDE5i), which may be prescribed alone, in combination with each other, or alongside PDE5i to address men’s sexual health. By signing below, you acknowledge that some of these compounded products are not FDA-approved for use in men and are prescribed off-label."], ["p", "Limited data exist regarding the safety and effectiveness of PT-141, oxytocin, and apomorphine in men, and standardized dosing guidelines have not been established. It is important that you understand the purpose, potential benefits, risks, side effects, and your responsibilities throughout treatment."], ["h2", "Purpose and Benefits"], ["p", "PT-141 (Bremelanotide):"], ["li", "Stimulates melanocortin receptors in the brain, which may improve erectile function."], ["li", "May enhance reliability of erections and sexual satisfaction."], ["p", "Oxytocin:"], ["li", "Often called the “bonding hormone,” it may promote intimacy, trust, and sexual desire."], ["li", "May enhance emotional closeness and overall sexual experience."], ["p", "Apomorphine:"], ["li", "A dopamine agonist that may improve erectile response by acting on central nervous system pathways."], ["li", "May be beneficial in men who do not respond adequately to PDE5 inhibitors."], ["p", "PDE5 Inhibitors (Sildenafil, Tadalafil, Vardenafil, Avanafil):"], ["li", "Improve erectile function by increasing blood flow to the penis during sexual stimulation."], ["li", "May enhance ability to achieve and maintain erections, sexual performance, and overall satisfaction."], ["p", "Together, these treatments may address decreased libido, support erectile function, and improve sexual health and well-being."], ["h2", "Potential Risks and Side Effects"], ["h3", "PT-141"], ["li", "Nausea or upset stomach"], ["li", "Headache"], ["li", "Flushing or redness"], ["li", "Dizziness or lightheadedness"], ["li", "Injection-site reactions (if injectable)"], ["li", "Possible skin hyperpigmentation"], ["h3", "Oxytocin"], ["li", "Mild headache"], ["li", "Nausea"], ["li", "Temporary changes in blood pressure"], ["li", "Mood or emotional fluctuations"], ["h3", "Apomorphine"], ["li", "Nausea and vomiting"], ["li", "Low blood pressure, fainting, or dizziness"], ["li", "Sleepiness or yawning"], ["li", "Rarely, changes in heart rhythm"], ["h3", "PDE5 Inhibitors (sildenafil, tadalafil, other)"], ["li", "Headache, flushing, indigestion"], ["li", "Nasal congestion"], ["li", "Dizziness or lightheadedness"], ["li", "Blurred vision or color changes (blue/green perception)"], ["li", "Back pain or muscle aches (more common with tadalafil)"], ["li", "Rare: hearing loss, ringing in ears, priapism (erection >4 hours), allergic reactions"], ["h3", "Rare but Serious Risks (All)"], ["li", "Significant or sustained blood pressure changes, which may increase risk of stroke or heart attack"], ["li", "Severe allergic reactions (swelling of face, lips, tongue, or throat)"], ["li", "Noticeable changes in mood or behavior"], ["p", "Do not use PDE5 inhibitors if:"], ["li", "You take nitrates for chest pain (angina)"], ["li", "You use recreational “poppers” (amyl nitrate or nitrite)"], ["li", "You have severe heart or liver problems, very low blood pressure, or recent stroke/heart attack"], ["p", "Seek emergency care immediately if you experience chest pain, trouble breathing, extreme dizziness, a prolonged erection, or signs of severe allergic reaction."], ["h2", "Monitoring Plan"], ["li", "Follow-Up Visits: Attend all scheduled appointments."], ["li", "Testing: Complete any recommended labs or blood pressure checks."], ["li", "Symptom Reporting: Inform your provider of any new or worsening symptoms, especially cardiovascular, mood, or visual changes."], ["h2", "Alternative Treatments"], ["li", "Lifestyle Modifications: Exercise, weight loss, improved sleep, stress reduction, and limiting alcohol or smoking."], ["li", "Therapies: Sex therapy, counseling, or relationship therapy."], ["li", "Other Medical Options: Hormone therapy, vacuum erection devices, penile injections, suppositories, or surgical implants."], ["h2", "Your Responsibilities"], ["li", "Use medications exactly as prescribed."], ["li", "Do not combine with contraindicated medications (especially nitrates or “poppers”)."], ["li", "Report all other medications, supplements, or health changes to your provider."], ["li", "Immediately report concerning side effects."], ["h2", "Acknowledgment and Consent"], ["p", "By signing below, you confirm that you:"], ["li", "Have read and understood this information."], ["li", "Are aware of the potential benefits, risks, and alternatives."], ["li", "Understand that use of PT-141, oxytocin, and apomorphine is off-label and not FDA-approved for men."], ["li", "Agree to follow your provider’s instructions and attend all follow-ups."], ["li", "Understand you may withdraw from treatment at any time."]], "consentOpts": ["I have read the above information, I understand the risks, and I would like to proceed.", "I have read the above information, and I do NOT wish to proceed."], "idText": "Upload a photo of a valid government-issued photo ID such as a driver’s license or passport which has your picture, name and date of birth clearly visible.  If applicable, upload a photo of the front and the back especially when using a military ID as your date of birth is on the back of the card.  Make sure the photo is clear and legible."};

   h=`<h1>Check your answers before you send them.</h1><p class="help">Your provider reads what you see here. Edit any step before you send.</p><div class="review">${groups.map(g=>`<div class="card"><div class="head"><b>${STEPS[g.st-1].name}</b><button type="button" data-edit="${g.items[0].id}">Edit</button></div>${g.items.map(x=>`<div class="v">${esc(x.q||({state:"State",dob:"Date of birth"}[x.type]))} · <span style="color:var(--teal)">${esc(val(x))}</span></div>`).join("")}</div>`).join("")}</div>${actions("Send to your provider")}`}
  else if(s.type==="sent"){h=`<h1>Sent. Your provider takes it from here.</h1><p class="help">We'll email you when your provider has reviewed your answers. The email won't say what it's about.</p>
   <ol class="steps3"><li><span><b>Provider review</b><br><span class="note">[time · operations]</span></span></li><li><span><b>Pharmacy</b>, only if your provider prescribes<br><span class="note">[partner · operations]</span></span></li><li><span><b>A plain package</b>, nothing on the outside about what's inside<br><span class="note">[time · operations]</span></span></li></ol>
   <div class="actions"><button class="btn primary" type="button" data-act="restart">Start the demo again</button></div>`}
  else if(s.type==="exit"){const e=exitInfo;const decl=e.why==="declined";
   h=decl?`<div class="dev">Consent declined: the assessment ends, nothing is sent.</div><h1>You chose not to go on.</h1><p class="help">Nothing was sent to a provider. If you change your mind, you can come back to the consent and read it again.</p>
     <div class="actions"><button class="btn primary" type="button" data-act="change">Back to the consent</button></div>`
   :`<div class="dev">Beluga rule: a red answer is fully disqualifying. Reason wording is ours, to confirm with Beluga clinical.</div><h1>We can't offer this treatment online.</h1>
     <p class="help" style="margin-bottom:8px">You told us:</p><div class="quote">“${esc(e.a)}”</div><p class="help">${esc(R[e.why]||R.cond)} Nothing was sent to a provider.</p>
     ${e.why==="cardio"?'<div class="sos"><b>If you have chest pain or trouble breathing right now, call 911.</b></div>':''}
     <div class="card" style="margin-top:20px"><b>What you can do</b><p class="help" style="margin:6px 0 0">See a doctor in person and share these answers. If you chose this by mistake, change your answer.</p></div>
     <div class="actions"><button class="btn ghost" type="button" data-act="change">Change my answer</button><button class="btn primary" type="button" data-act="restart">Start the demo again</button></div>`}
  const old=stage.firstElementChild;setGlyph(s.type==="exit"?"stop":s.icon);
  const mount=()=>{stage.style.minHeight="";stage.innerHTML=`<div class="q">${h}</div>`;wire(s);
    const f=stage.querySelector("input,select,textarea");if(f&&!mobile())f.focus({preventScroll:true})};
  if(old){stage.style.minHeight=stage.offsetHeight+"px";old.classList.add("leaving");if(window.scrollY>40)window.scrollTo({top:0,behavior:mobile()?"smooth":"auto"});setTimeout(mount,220)}else mount();
  const st=s.type==="exit"?lastStep:s.step;
  if(st!==lastStep){const prev=lastStep;companion(st);if(st>prev&&prev>0&&prev<=7)toast(`Step ${prev} done · ${STEPS[prev-1].name}`);lastStep=st;const cap=$("#cap");cap.classList.remove("breathe");void cap.offsetWidth;cap.classList.add("breathe")}
}
function docHTML(items){let h="",inList=false;for(const [k,t] of items){if(k==="li"){if(!inList){h+="<ul>";inList=true}h+=`<li>${esc(t)}</li>`;continue}if(inList){h+="</ul>";inList=false}h+=k==="h1"||k==="h2"?`<h3>${esc(t)}</h3>`:k==="h3"?`<h4>${esc(t)}</h4>`:`<p>${esc(t)}</p>`}if(inList)h+="</ul>";return h}
function go(d){i=Math.max(0,Math.min(SCREENS.length-1,i+d));render()}
function toExit(info){exitInfo=info;SCREENS.exitFrom=i;const ex={id:"exit",type:"exit",step:lastStep};render.call(null,SCREENS.__ex=ex);}
function wire(s){
  stage.querySelectorAll("[data-act=back]").forEach(b=>b.onclick=()=>go(-1));
  stage.querySelectorAll("[data-act=restart]").forEach(b=>b.onclick=()=>{for(const k in A)delete A[k];i=0;lastStep=-1;exitInfo=null;render()});
  stage.querySelectorAll("[data-act=change]").forEach(b=>b.onclick=()=>{i=SCREENS.exitFrom??i;exitInfo=null;render()});
  stage.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{i=SCREENS.findIndex(x=>x.id===b.dataset.edit);render()});
  const next=stage.querySelector("[data-act=next]"), err=stage.querySelector("#err");
  const clearErr=()=>{if(err){err.classList.remove("on");stage.querySelectorAll(".err").forEach(x=>x.classList.remove("err"));stage.querySelectorAll(".tx.bad,textarea.bad").forEach(x=>x.classList.remove("bad"))}};
  stage.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(s,b.dataset.id,+b.dataset.k));
  stage.querySelectorAll("[data-tx]").forEach(t=>t.oninput=()=>{A[t.dataset.tx]=t.value;t.classList.remove("bad");if(err)err.classList.remove("on")});
  if(s.type==="state"){const sel=stage.querySelector("#state");const upd=()=>{A.state=sel.value;const no=sel.value==="Alaska";
    stage.querySelector("#stateMsg").innerHTML=no?`<div class="info"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="8.25" stroke="#264653" stroke-width="1.5"/><path d="M10 9v5M10 6.2v.1" stroke="#264653" stroke-width="1.5" stroke-linecap="round"/></svg><div><b>We can't offer care in Alaska.</b>Providers need a license in your state, so the assessment can't go on from here. If you chose the wrong state, change it.<div style="margin-top:10px"><button class="btn ghost" type="button">Notify me when care opens</button></div></div></div>`:"";next.disabled=no};sel.onchange=upd;upd()}
  if(s.type==="dob"){const ids=["mm","dd","yy"],lens=[2,2,4];ids.forEach((id,k)=>{const el=stage.querySelector("#"+id);el.oninput=()=>{el.value=el.value.replace(/\D/g,"");if(el.value.length>=lens[k]&&k<2)stage.querySelector("#"+ids[k+1]).focus()}})}
  if(s.type==="consent"){const mb=stage.querySelector("#moreBtn");mb.onclick=()=>{const m=stage.querySelector("#more");const o=!m.classList.contains("open");m.classList.toggle("open",o);mb.setAttribute("aria-expanded",o);mb.textContent=o?"Hide the full consent":"Read the full consent"}}
  if(s.type==="id"){const up=()=>{A.idup=true;render.inplace=true;const u=stage.querySelector("#upl");u.innerHTML=`<div class="done">${tick()} driver-license-front.jpg</div>`;if(err)err.classList.remove("on")};["#up1","#up2"].forEach(x=>{const b=stage.querySelector(x);if(b)b.onclick=up})}
  if(next)next.onclick=()=>{
    if(s.type==="email")A.email=stage.querySelector("#email").value;
    if(s.type==="dob")A.dob={m:stage.querySelector("#mm").value||"02",d:stage.querySelector("#dd").value||"14",y:stage.querySelector("#yy").value||"1978"};
    if(["single","multi","text"].includes(s.type)){
      const red=firstRed(s);if(red){toExit(red);return}
      const miss=missing(s);if(miss.length){err.classList.add("on");stage.querySelector("#errTxt").textContent=miss.length===1&&miss[0]===s.id?(s.type==="text"?"Type an answer to go on.":"Choose an answer to go on."):"Answer the open question to go on.";
        miss.forEach(m=>{const g=stage.querySelector(`[data-grp="${m}"]`);if(g)g.classList.add("err");const t=stage.querySelector(`[data-tx="${m}"]`);if(t)t.classList.add("bad")});
        const firstEl=stage.querySelector(`[data-grp="${miss[0]}"],[data-tx="${miss[0]}"]`);if(firstEl&&mobile())firstEl.scrollIntoView({behavior:"smooth",block:"center"});return}}
    if(s.type==="consent"){if(A.consent==null){err.classList.add("on");return}if(A.consent===1){toExit({why:"declined"});return}}
    if(s.type==="terms"&&![0,1].every(k=>(A.terms||[]).includes(k))){err.classList.add("on");stage.querySelector(".opts").classList.add("err");return}
    if(s.type==="id"&&!A.idup){err.classList.add("on");return}
    go(1)};
  s._clear=clearErr;
}
function pick(s,id,k){
  const b=id==="consent"?{type:"single",opts:LEGAL.consentOpts.map(t=>({t}))}:id==="terms"?{type:"multi",opts:[{},{},{}]}:findBlock(s,id);
  if(b.type==="single"){A[id]=k}else{let v=A[id]||[];const ex=b.opts[k]&&b.opts[k].excl;if(ex)v=v.includes(k)?[]:[k];else{v=v.filter(x=>!(b.opts[x]&&b.opts[x].excl));v=v.includes(k)?v.filter(x=>x!==k):[...v,k]}A[id]=v}
  stage.querySelectorAll(`.opt[data-id="${id}"]`).forEach(el=>{const kk=+el.dataset.k;el.setAttribute("aria-checked",b.type==="single"?kk===A[id]:(A[id]||[]).includes(kk))});
  const grp=stage.querySelector(`[data-grp="${id}"]`);if(grp)grp.classList.remove("err");const e=stage.querySelector("#err");if(e)e.classList.remove("on");
  if(["single","multi","text"].includes(s.type))refreshFus(s);
  // single choice: a red answer stops right away; a plain answer with no follow-up moves on
  if(b.type==="single"&&id!=="consent"){const o=b.opts[k];clearTimeout(pick.t);
    if(o.red){pick.t=setTimeout(()=>{if(SCREENS[i]===s)toExit({q:b.q,a:o.t,why:o.red,screen:i})},320);return}
    if(id===s.id&&!o.fu&&!(s.fus)){pick.t=setTimeout(()=>{if(SCREENS[i]===s)go(1)},320)}
    else if(id===s.id&&!o.fu&&s.fus){pick.t=setTimeout(()=>{if(SCREENS[i]===s&&!missing(s).length)go(1)},320)}
    else if(o.fu&&mobile()){setTimeout(()=>{const f=stage.querySelector(`.fu.open`);if(f)f.scrollIntoView({behavior:"smooth",block:"center"})},340)}
  }
}
// exit screen renders through render() with a temporary screen object
const _render=render;
render=function(ex){if(ex&&ex.type==="exit"){const keep=i;SCREENS.splice(SCREENS.length,0);const s=ex;const cur=SCREENS[i];SCREENS[i]=s;_render();SCREENS[i]=cur;i=keep;return}_render()};
document.getElementById("devbtn").onclick=e=>{const on=document.body.classList.toggle("devon");e.currentTarget.setAttribute("aria-pressed",on);e.currentTarget.textContent=on?"Hide logic":"Show logic"};
document.addEventListener("keydown",e=>{const s=SCREENS[i];const tg=e.target;if(tg&&tg.matches&&tg.matches("input,select,textarea"))return;if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="Enter"){const n=stage.querySelector("[data-act=next]");if(n&&!n.disabled){e.preventDefault();n.click()}return}
  if(e.key.length===1&&["single","multi","consent","terms"].includes(s.type)){const k=e.key.toUpperCase().charCodeAt(0)-65;const top=[...stage.querySelectorAll(".opt")].filter(x=>x.querySelector(".key"));if(k>=0&&k<top.length){e.preventDefault();top[k].click()}}});
render();
